services:
  db:
    image: postgres:16-alpine
    container_name: skillhub-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillhub_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skillhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skillhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: skillhub-mailpit
    ports:
      - "${SMTP_PORT:-1025}:1025"       # SMTP Inbound Port
      - "${MAILPIT_UI_PORT:-8025}:8025" # Interactive Webmail Inbox UI
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillhub-api
    ports:
      - "${API_PORT:-5142}:5142"
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-skillhub_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-SkillHub_JwtSigningKey_2026_CleanArch_Min32Bytes!}
      Jwt__Issuer: ${JWT_ISSUER:-SkillHubAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-SkillHubClient}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-120}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: false
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-no-reply@skillhub.internal}
      Smtp__FromName: ${SMTP_FROM_NAME:-SkillHub Platform}
      EnableHttpsRedirection: "false"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5142
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  skillhub_pgdata:
    driver: local
